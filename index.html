    <div class="container-fluid" 
        style="

                background-size: cover; 
                background-position: center; 
                padding:215px 20px">
        <div class="text-center">
            <h1 style="font-size: 50px;">

    <br>
    <br>
     <div class="container">
        <h2>THIS IS US</h2>
        <div class="scroll-img d-flex overflow-auto p-2" style="white-space: nowrap;">
            <img src="6.jpg" class="rounded" alt="gambar round" style="width: 200px; height: auto; border-radius:15px">
            <img src="7.jpg" class="rounded" alt="gambar round2" style="width: 200px; height: auto;">
            <img src="8.jpg" class="rounded" alt="gambar round3" style="width: 200px; height: auto;">
            <img src="9.jpg" class="rounded" alt="gambar round4" style="width: 200px; height: auto;">
            <img src="10.jpg" class="rounded" alt="gambar round4" style="width: 200px; height: auto;">
        </div>
    </div>
    <script>
        const container = document.querySelector('.scroll-img');
        container.innerHTML += container.innerHTML;
        let scrollAmount = 0;
        const speed = 1;

        function autoscroll(){
            scrollAmount += speed;
            container.scrollLeft = scrollAmount;

            if(scrollAmount>= container.scrollWidth / 2){
                scrollAmount = 0;
            }
        }

        let auto = setInterval(autoscroll, 20);

        container.addEventListener('mouseenter', () => clearInterval(auto));
        container.addEventListener('mouseleave', () => auto= setInterval(autoscroll, 20));
    </script>
</body>
</html>
